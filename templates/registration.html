<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta content="Warehouse management webpage" name="description">
	<meta content="management" name="keywords">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta content="rgb(33, 35, 40)" name="theme-color">
	<link href="/static/images/Icon.svg" rel="icon">
	<link href="/static/images/Icon.svg" rel="shortcut icon">
	<link href="/static/css/dist/style.css" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
	<script src="/static/js/csrf.js"></script>
	<script>(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');}catch(e){}})();</script>
	<script src="/static/js/theme.js"></script>
	<title>Регистрация — Управление складом</title>
</head>
<body class="bg-surface text-ink font-sans">

<header class="fixed top-0 left-0 z-20 flex items-center gap-3 h-16 w-full px-5 bg-panel border-b border-line" hx-boost="true">
	<a class="flex items-center gap-2.5 text-ink" href="/">
		<img alt="" class="block w-8 h-8" src="/static/images/Icon.svg">
		<span class="text-lg font-semibold tracking-tight">Управление складом</span>
	</a>
	<div class="ml-auto flex items-center gap-2">
		<button class="text-sm border border-line rounded-md px-3 py-1.5 cursor-pointer hover:text-accent hover:border-accent" id="theme_toggle_btn" onclick="toggleTheme()" type="button">☀️</button>
		<form action="/logout" hx-boost="true" method="post">
			<button class="text-sm border border-line rounded-md px-3 py-1.5 cursor-pointer hover:text-accent hover:border-accent" type="submit">Выйти</button>
		</form>
	</div>
</header>

<nav class="fixed top-16 left-0 w-[220px] h-[calc(100vh_-_4rem)] overflow-y-auto bg-rail border-r border-line py-2.5">
	<ul>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats">Общая аналитика</a></li>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats/sales">Аналитика продаж</a></li>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats/goods">Аналитика товаров</a></li>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats/warehouse">Складская аналитика</a></li>
		<!--{create_link}-->
		<!--{registration_link}-->
	</ul>
</nav>

<main class="ml-[220px] max-w-[1180px] px-8 pt-[5.75rem] pb-12">
	<h1 class="text-2xl font-semibold mb-6">Регистрация пользователя</h1>
	<div class="max-w-[420px] bg-card border border-line rounded-lg p-5">
		<p class="text-danger text-sm mb-3 min-h-[1.1em]"><!--{error_message}--></p>
		<p class="text-ok text-sm mb-3 min-h-[1.1em]"><!--{success_message}--></p>
		<form hx-boost="true" method="post" name="logForm">
			<div class="mb-4">
				<label class="block text-sm text-muted font-medium mb-1.5" for="email">Email</label>
				<input autocomplete="email" class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 placeholder:text-muted focus:outline-none focus:border-accent" id="email" name="email" placeholder="Email" type="email" required>
			</div>
			<div class="mb-4">
				<label class="block text-sm text-muted font-medium mb-1.5" for="password">Пароль</label>
				<input autocomplete="new-password" class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 placeholder:text-muted focus:outline-none focus:border-accent" id="password" name="password" placeholder="Пароль" type="password" required>
			</div>
			<div class="mb-4">
				<span class="block text-sm text-muted font-medium mb-1.5">Права доступа</span>
				<!--{permissions}-->
			</div>
			<button class="w-full text-[0.95rem] font-medium text-white bg-accent border border-accent rounded-md px-4 py-2.5 cursor-pointer hover:bg-accent2 hover:border-accent2" type="submit">Зарегистрировать</button>
		</form>
	</div>
</main>

</body>
</html>
