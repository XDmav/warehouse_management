<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta content="Warehouse management webpage" name="description">
	<meta content="management" name="keywords">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta content="rgb(45, 45, 50)" name="theme-color">
	<link href="/static/images/Icon.svg" rel="icon">
	<link href="/static/images/Icon.svg" rel="shortcut icon">
	<link href="/static/css/dist/style.css" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
	<script src="/static/js/receipt_create.js"></script>
	<script src="/static/js/csrf.js"></script>
	<title>Warehouse management</title>
</head>
<body>

<header class="top_bar" hx-boost="true">
	<a class="top_link" href="/">
		<img alt="Icon" class="top_image" src="/static/images/Icon.svg">
		<span class="top_text">Управление складом</span>
	</a>
	<form action="/logout" class="ml-auto" hx-boost="true" method="post">
		<button class="top_link" type="submit">
        <span class="top_login_text">
            Log out
        </span>
		</button>
	</form>
</header>

<div class="fixed bg-[rgb(40,40,45)] mt-17.5 w-40 h-1/1">
	<ul class="text-2xl">
		<li class="mt-3 pb-3 border-b border-b-[rgb(85,85,95)] text-center"><a href="/stats">Общая аналитика</a></li>
		<li class="mt-3 pb-3 border-b border-b-[rgb(85,85,95)] text-center"><a href="/stats/sales">Аналитика продаж</a></li>
		<li class="mt-3 pb-3 border-b border-b-[rgb(85,85,95)] text-center"><a href="/stats/goods">Аналитика товаров</a></li>
		<li class="mt-3 pb-3 border-b border-b-[rgb(85,85,95)] text-center"><a href="/stats/warehouse">Складская аналитика</a></li>
	</ul>
</div>

<div class="ml-40 p-8 pt-20">
	<h1 class="text-3xl mb-6">Создание чека</h1>
	
	<form
			id="receiptForm"
			hx-post="/receipts/new"
			hx-target="#result"
			hx-swap="innerHTML"
			class="space-y-6"
	>
		<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
			<div>
				<label class="block mb-2" for="receipt_date">Дата</label>
				<input
						class="border p-2 w-full"
						id="receipt_date"
						name="receipt_date"
						required
						type="date"
				>
			</div>
			
			<div>
				<label class="block mb-2" for="payment_type">Тип оплаты</label>
				<select
						class="border p-2 w-full bg-[rgb(50,50,55)]"
						id="payment_type"
						name="payment_type"
						required
				>
					<!--{payment_types}-->
				</select>
			</div>
		</div>
		
		<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
			<div>
				<label class="block mb-2" for="cashier_search">Кассир</label>
				<input
						class="border p-2 w-full mb-2"
						id="cashier_search"
						oninput="filterOptions(this,'cashier_select')"
						placeholder="Поиск..."
						type="text"
				>
				<label>
					<select
							class="border p-2 w-full bg-[rgb(50,50,55)]"
							id="cashier_select"
							name="cashier_id"
							required
					>
						<!--{cashiers}-->
					</select>
				</label>
			</div>
			
			<div>
				<label class="block mb-2" for="delivery_type">Способ получения</label>
				<select
						class="border p-2 w-full bg-[rgb(50,50,55)]"
						id="delivery_type"
						name="delivery_type"
						required
				>
					<!--{delivery_types}-->
				</select>
			</div>
			
			<div>
				<label class="block mb-2" for="store_search">Магазин</label>
				<input
						class="border p-2 w-full mb-2"
						id="store_search"
						oninput="filterOptions(this,'store_select')"
						placeholder="Поиск..."
						type="text"
				>
				<label>
					<select
							class="border p-2 w-full bg-[rgb(50,50,55)]"
							id="store_select"
							name="store_id"
					>
						<option value="">Не выбран</option>
						<!--{stores}-->
					</select>
				</label>
			</div>
		</div>
		
		<div>
			<h2 class="text-2xl mb-3">Товары</h2>
			
			<div class="overflow-x-auto">
				<table class="w-full border mb-4">
					<thead>
					<tr class="border">
						<th class="p-2">Товар</th>
						<th class="p-2">Остаток</th>
						<th class="p-2">Количество</th>
						<th class="p-2">Цена</th>
						<th class="p-2">Сумма</th>
						<th class="p-2"></th>
					</tr>
					</thead>
					<tbody id="items"></tbody>
				</table>
			</div>
			
			<button
					class="bg-green-600 text-white px-4 py-2"
					onclick="addItem()"
					type="button"
			>
				Добавить товар
			</button>
		</div>
		
		<div class="text-2xl">
			Итого: <span id="total">0.00</span>
		</div>
		
		<div class="flex items-center gap-3">
			<button class="bg-blue-600 text-white px-6 py-2" type="submit">
				Создать чек
			</button>
			<span class="text-sm opacity-80">После добавления позиции проверь остаток и итоговую сумму.</span>
		</div>
	</form>
	
	<div class="mt-4" id="result"></div>
</div>

</body>
</html>
