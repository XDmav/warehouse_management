<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta content="Warehouse management webpage" name="description">
	<meta content="management" name="keywords">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta content="rgb(33, 35, 40)" name="theme-color">
	<link href="/static/images/Icon.svg" rel="icon">
	<link href="/static/images/Icon.svg" rel="shortcut icon">
	<link href="/static/css/dist/style.css" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
	<script src="/static/js/receipt_create.js"></script>
	<script src="/static/js/csrf.js"></script>
	<script>(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');}catch(e){}})();</script>
	<script src="/static/js/theme.js"></script>
	<title>Создание чека — Управление складом</title>
</head>
<body class="bg-surface text-ink font-sans">

<header class="fixed top-0 left-0 z-20 flex items-center gap-3 h-16 w-full px-5 bg-panel border-b border-line" hx-boost="true">
	<a class="flex items-center gap-2.5 text-ink" href="/">
		<img alt="" class="block w-8 h-8" src="/static/images/Icon.svg">
		<span class="text-lg font-semibold tracking-tight">Управление складом</span>
	</a>
	<div class="ml-auto flex items-center gap-2">
		<button class="text-sm border border-line rounded-md px-3 py-1.5 cursor-pointer hover:text-accent hover:border-accent" id="theme_toggle_btn" onclick="toggleTheme()" type="button">☀️</button>
		<form action="/logout" hx-boost="true" method="post">
			<button class="text-sm border border-line rounded-md px-3 py-1.5 cursor-pointer hover:text-accent hover:border-accent" type="submit">Выйти</button>
		</form>
	</div>
</header>

<nav class="fixed top-16 left-0 w-55 h-[calc(100vh-4rem)] overflow-y-auto bg-rail border-r border-line py-2.5">
	<ul>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats">Общая аналитика</a></li>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats/sales">Аналитика продаж</a></li>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats/goods">Аналитика товаров</a></li>
		<li><a class="block px-5 py-2.5 text-[0.95rem] text-muted border-l-[3px] border-transparent hover:text-ink hover:bg-rowhover hover:border-accent" href="/stats/warehouse">Складская аналитика</a></li>
		<!--{create_link}-->
		<!--{registration_link}-->
	</ul>
</nav>

<main class="ml-55 max-w-295 px-8 pt-23 pb-12">
	<h1 class="text-2xl font-semibold mb-6">Создание чека</h1>

	<form id="receiptForm" hx-post="/receipts/new" hx-target="#result" hx-swap="innerHTML">
		<div class="bg-card border border-line rounded-lg p-5 mb-5">
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<label class="block text-sm text-muted font-medium mb-1.5" for="receipt_date">Дата</label>
					<input class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 focus:outline-none focus:border-accent" id="receipt_date" name="receipt_date" required type="date">
				</div>
				<div>
					<label class="block text-sm text-muted font-medium mb-1.5" for="payment_type">Тип оплаты</label>
					<select class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 focus:outline-none focus:border-accent" id="payment_type" name="payment_type" required>
						<!--{payment_types}-->
					</select>
				</div>
			</div>

			<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
				<div>
					<label class="block text-sm text-muted font-medium mb-1.5" for="cashier_search">Кассир</label>
					<input class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 mb-1.5 placeholder:text-muted focus:outline-none focus:border-accent" id="cashier_search" oninput="filterOptions(this,'cashier_select')" placeholder="Поиск..." type="text">
					<label for="cashier_select"></label>
					<select class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 focus:outline-none focus:border-accent" id="cashier_select" name="cashier_id" required>
						<!--{cashiers}-->
					</select>
				</div>
				<div>
					<label class="block text-sm text-muted font-medium mb-1.5" for="delivery_type">Способ получения</label>
					<select class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 focus:outline-none focus:border-accent" id="delivery_type" name="delivery_type" required>
						<!--{delivery_types}-->
					</select>
				</div>
				<div>
					<label class="block text-sm text-muted font-medium mb-1.5" for="store_search">Магазин</label>
					<input class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 mb-1.5 placeholder:text-muted focus:outline-none focus:border-accent" id="store_search" oninput="filterOptions(this,'store_select')" placeholder="Поиск..." type="text">
					<label for="store_select"></label>
					<select class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 focus:outline-none focus:border-accent" id="store_select" name="store_id">
						<option value="">Не выбран</option>
						<!--{stores}-->
					</select>
				</div>
			</div>

			<div class="mt-4 max-w-120">
				<label class="block text-sm text-muted font-medium mb-1.5" for="card_number">Карта покупателя</label>
				<input class="w-full text-[0.95rem] text-ink bg-field border border-line rounded-md px-3 py-2.5 placeholder:text-muted focus:outline-none focus:border-accent" id="card_number" name="card_number" type="text" maxlength="64" placeholder="Номер карты лояльности (необязательно)" oninput="onCardInput(this)">
				<div class="text-muted text-sm mt-1.5" id="card_status"></div>
			</div>
		</div>

		<h2 class="text-lg font-semibold mb-3">Товары</h2>
		<div class="border border-line rounded-lg overflow-hidden mb-4">
			<table class="w-full text-[0.95rem]">
				<thead>
				<tr>
					<th class="text-left px-3.5 py-2.5 bg-card text-muted text-xs font-semibold uppercase tracking-wide border-b border-line">Товар</th>
					<th class="text-left px-3.5 py-2.5 bg-card text-muted text-xs font-semibold uppercase tracking-wide border-b border-line">Остаток</th>
					<th class="text-left px-3.5 py-2.5 bg-card text-muted text-xs font-semibold uppercase tracking-wide border-b border-line">Количество</th>
					<th class="text-left px-3.5 py-2.5 bg-card text-muted text-xs font-semibold uppercase tracking-wide border-b border-line">Цена</th>
					<th class="text-left px-3.5 py-2.5 bg-card text-muted text-xs font-semibold uppercase tracking-wide border-b border-line">Скидка</th>
					<th class="text-left px-3.5 py-2.5 bg-card text-muted text-xs font-semibold uppercase tracking-wide border-b border-line">Сумма</th>
					<th class="bg-card border-b border-line"></th>
				</tr>
				</thead>
				<tbody class="divide-y divide-line" id="items"></tbody>
			</table>
		</div>

		<button class="text-[0.95rem] font-medium text-ink bg-field border border-line rounded-md px-4 py-2.5 cursor-pointer hover:border-accent" onclick="addItem()" type="button">Добавить товар</button>

		<div class="text-xl font-semibold my-5">
			Итого: <span id="total">0.00</span>
		</div>

		<div class="flex items-center gap-3">
			<button class="text-[0.95rem] font-medium text-white bg-accent border border-accent rounded-md px-4 py-2.5 cursor-pointer hover:bg-accent2 hover:border-accent2" type="submit">Создать чек</button>
			<span class="text-muted text-sm">После добавления позиции проверьте остаток и итоговую сумму.</span>
		</div>
	</form>

	<div class="mt-4" id="result"></div>
</main>

</body>
</html>
