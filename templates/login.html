<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta content="Warehouse management webpage" name="description">
	<meta content="management" name="keywords">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta content="rgb(45, 45, 50)" name="theme-color">
	<link href="/static/images/Icon.svg" rel="icon">
	<link href="/static/images/Icon.svg" rel="shortcut icon">
	<link href="/static/css/dist/style.css" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Moderustic:wght@300..800&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
	<script src="/static/js/csrf.js"></script>
	<script>(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');}catch(e){}})();</script>
	<script src="/static/js/theme.js"></script>
	<title>Warehouse management</title>
</head>
<body>

<header class="top_bar" hx-boost="true">
	<a class="top_link" href="/">
		<img alt="Icon" class="top_image" src="/static/images/Icon.svg">
		<span class="top_text">Управление складом</span>
	</a>
	<button class="theme_toggle mr-auto" id="theme_toggle_btn" onclick="toggleTheme()" type="button">☀️</button>
</header>

<div class="pt-20 p-8">
	<div class="log_box">
		<h1 class="main_text">
			Login
		</h1>
		<p class="text-red-400 mb-2"><!--{message}--></p>
		<form hx-boost="true" method="post" name="logForm">
			<div>
				<label>
					<input autocomplete="email" class="input_box" id="email" name="email" placeholder="Email" type="email">
				</label>
			</div>
			<div>
				<label>
					<input autocomplete="current-password" class="input_box" id="password" name="password" placeholder="Password" type="password">
				</label>
			</div>
			<button class="input_button border border-solid border-gray-300">
				Log in
			</button>
		</form>
	</div>
</div>

</body>
</html>
